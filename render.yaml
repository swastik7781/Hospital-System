services:
  - type: web
    name: utkal-hospital-ehr
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/seed.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true

